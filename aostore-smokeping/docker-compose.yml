version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: aostore-smokeping_web_1
      APP_PORT: 80

  web:
    image: lscr.io/linuxserver/smokeping:2.9.0-r0-ls186@sha256:52ab5b6bb2cbe03e775f970ac110300964d4069917820fccdfd6db80dd5ac143
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/data:/data
