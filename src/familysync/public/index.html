<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3559c7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FamilySync">
  <title>FamilySync</title>
  <script>
    // Opened as ".../subpath" without the trailing slash (behind a proxy such
    // as Home Assistant ingress), relative URLs would resolve against the
    // parent folder: add the slash first. Assets are written from here, not
    // as plain tags, so the browser does not prefetch them from the wrong place.
    if (!location.pathname.endsWith('/') && !/\.\w+$/.test(location.pathname)) {
      location.replace(location.pathname + '/' + location.search + location.hash);
    } else {
      document.write(
        '<link rel="icon" href="icon.svg" type="image/svg+xml">' +
        '<link rel="apple-touch-icon" href="icon.svg">' +
        '<link rel="manifest" href="manifest.webmanifest">' +
        '<link rel="stylesheet" href="styles.css">' +
        '<script src="app.js" defer><\/script>'
      );
    }
  </script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#inicio">FamilySync</a>
    <nav id="nav" aria-label="Secciones"></nav>
  </header>

  <main id="view" tabindex="-1"></main>

  <dialog id="dialog">
    <form id="form" method="dialog">
      <h2 id="form-title"></h2>
      <div id="form-fields"></div>
      <p id="form-error" class="error" role="alert" hidden></p>
      <div class="actions">
        <button type="button" id="form-delete" class="danger" hidden>Borrar</button>
        <span class="spacer"></span>
        <button type="button" id="form-cancel">Cancelar</button>
        <button type="submit" class="primary">Guardar</button>
      </div>
    </form>
  </dialog>

</body>
</html>
