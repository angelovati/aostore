name: microsocks image

on:
  push:
    paths: ["src/microsocks/**", ".github/workflows/microsocks-image.yml"]
  pull_request:
    paths: ["src/microsocks/**", ".github/workflows/microsocks-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t microsocks-test src/microsocks
      - name: Proxy a request through SOCKS5
        run: |
          docker run -d --name microsocks -p 1080:1080 microsocks-test
          sleep 2
          test "$(docker top microsocks -o pid,user | awk 'NR > 1 { print $2 }')" = nobody
          curl -fsS -o /dev/null --max-time 20 --socks5-hostname 127.0.0.1:1080 https://github.com/

  image:
    needs: test
    runs-on: ubuntu-latest
    env:
      # Publish only from the default branch (the one umbrelOS reads the store from)
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(sed -n 's/^ARG MICROSOCKS_VERSION=//p' src/microsocks/Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: src/microsocks
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/aostore-microsocks:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/aostore-microsocks:latest
      - name: Image reference to pin in docker-compose.yml
        if: env.PUBLISH == 'true'
        run: echo "ghcr.io/${{ github.repository_owner }}/aostore-microsocks:${{ steps.version.outputs.version }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
