name: WaBridge image

on:
  push:
    paths: ["src/wabridge/**", ".github/workflows/wabridge-image.yml"]
  pull_request:
    paths: ["src/wabridge/**", ".github/workflows/wabridge-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/wabridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    env:
      # Publish only from the default branch (the one umbrelOS reads the store from)
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(node -p "require('./src/wabridge/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: src/wabridge
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/aostore-wabridge:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/aostore-wabridge:latest
