version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: aostore-familysync_web_1
      APP_PORT: 3000
      # The calendar feed is read by the phone's calendar app, which cannot log
      # in to umbrelOS; it is protected by a secret token in its URL instead.
      PROXY_AUTH_WHITELIST: "/cal/*"

  web:
    image: ghcr.io/angelovati/aostore-familysync:0.1.2
    restart: on-failure
    user: "1000:1000"
    environment:
      PORT: 3000
      DATA_DIR: /data
      TZ: America/Argentina/Buenos_Aires
      # Calendar feed link shown when the app is opened through a proxy such as
      # Home Assistant ingress, whose own address needs a Home Assistant login
      FEED_BASE_URL: "http://${DEVICE_DOMAIN_NAME}:3743/"
    # Direct port for Home Assistant (hass_ingress), without the umbrelOS
    # login that app_proxy adds on 3743: HA requests the app from its server,
    # which has no Umbrel session. Anyone on the local network can open it.
    ports:
      - "3744:3000"
    volumes:
      - ${APP_DATA_DIR}/data:/data
