version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: aostore-familysync_web_1
      APP_PORT: 3000
      # The calendar feed is read by the phone's calendar app, which cannot log
      # in to umbrelOS; it is protected by a secret token in its URL instead.
      PROXY_AUTH_WHITELIST: "/cal/*"

  web:
    image: ghcr.io/angelovati/aostore-familysync:0.1.0
    restart: on-failure
    user: "1000:1000"
    environment:
      PORT: 3000
      DATA_DIR: /data
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - ${APP_DATA_DIR}/data:/data
